# Локальный override для MacBook.
# Все опубликованные порты слушают только 127.0.0.1, чтобы стенд не был доступен
# из внешней сети ноутбука.
services:
  gos_arm_adm:
    ports:
      # RDP к adm: внешний порт задается ADM_RDP_HOST_PORT в .env.
      - "127.0.0.1:${ADM_RDP_HOST_PORT}:3389/tcp"
      # SSH к adm: внешний порт задается ADM_SSH_HOST_PORT в .env.
      - "127.0.0.1:${ADM_SSH_HOST_PORT}:22/tcp"

  gos_arm_user:
    ports:
      # RDP к user: внешний порт задается USER_RDP_HOST_PORT в .env.
      - "127.0.0.1:${USER_RDP_HOST_PORT}:3389/tcp"
      # SSH к user: внешний порт задается USER_SSH_HOST_PORT в .env.
      - "127.0.0.1:${USER_SSH_HOST_PORT}:22/tcp"

  gos_arm_evil:
    ports:
      # RDP к внешней evil-машине доступен только локально на MacBook.
      - "127.0.0.1:${EVIL_RDP_HOST_PORT}:3389/tcp"
      # SSH к evil публикуется отдельно; SSH роутера наружу не публикуется.
      - "127.0.0.1:${EVIL_SSH_HOST_PORT}:22/tcp"

  gos_web:
    ports:
      # HTTP к EspoCRM: внешний порт задается ESPOCRM_HTTP_HOST_PORT в .env.
      - "127.0.0.1:${ESPOCRM_HTTP_HOST_PORT}:80/tcp"

  gos_siem_dashboard:
    ports:
      # HTTPS к Wazuh Dashboard: внешний порт задается WAZUH_DASHBOARD_HOST_PORT в .env.
      - "127.0.0.1:${WAZUH_DASHBOARD_HOST_PORT}:443/tcp"
