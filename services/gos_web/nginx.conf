# Основной nginx-конфиг web-машины.
# Версия nginx фиксируется в Dockerfile; этот файл описывает только виртуальный хост EspoCRM.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        # EspoCRM 10 использует public/ как document root.
        root /var/www/espocrm/public;
        index index.php index.html;

        # Основной frontend и SPA fallback EspoCRM.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Статические client-файлы лежат вне public, поэтому отдаем их отдельным alias.
        location /client/ {
            alias /var/www/espocrm/client/;
            try_files $uri =404;
        }

        # API EspoCRM требует rewrite на public/api/v1/index.php.
        location /api/v1/ {
            if (!-e $request_filename) {
                rewrite ^/api/v1/(.*)$ /api/v1/index.php last;
                break;
            }
        }

        # Portal оставлен по официальной схеме EspoCRM.
        location /portal/ {
            try_files $uri $uri/ /portal/index.php?$query_string;
        }

        location /api/v1/portal-access {
            if (!-e $request_filename) {
                rewrite ^/api/v1/(.*)$ /api/v1/portal-access/index.php last;
                break;
            }
        }

        location ~ /reset/?$ {
            try_files /reset.html =404;
        }

        # PHP выполняется через PHP-FPM внутри этого же контейнера.
        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
        }

        # Закрываем служебные директории EspoCRM от прямого HTTP-доступа.
        location ^~ /data/ {
            deny all;
        }

        location ^~ /application/ {
            deny all;
        }

        location ^~ /custom/ {
            deny all;
        }

        location ^~ /vendor/ {
            deny all;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
